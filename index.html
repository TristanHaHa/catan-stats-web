<!doctype html>
<html lang="en" data-theme="walnut">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#25231e" />
    <meta
      name="description"
      content="The Settler’s Ledger: a thoughtful Catan companion for dice, turn timing, and shared game nights."
    />
    <title>The Settler’s Ledger · Catan companion</title>
    <script>
      try {
        if (localStorage.getItem('ledger.theme') === 'parchment') {
          document.documentElement.dataset.theme = 'parchment';
          document.documentElement.style.background = '#eee9de';
          document.documentElement.style.colorScheme = 'light';
          document.querySelector('meta[name="theme-color"]').content = '#eee9de';
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
